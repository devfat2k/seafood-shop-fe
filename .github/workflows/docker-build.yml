name: Docker Build & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: seafood-shop-web:test
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8085
            NEXT_PUBLIC_LOGGING_LEVEL=info
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Container Startup
        run: |
          docker run -d --name seafood-web-test -p 3000:3000 seafood-shop-web:test
          sleep 5
          docker ps
          docker logs seafood-web-test
          docker stop seafood-web-test
